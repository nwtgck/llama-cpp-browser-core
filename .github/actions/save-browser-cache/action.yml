name: Save browser compiler caches
description: Save validated downloads and reusable intermediates after a successful trusted build.
inputs:
  dawn-key:
    required: true
    description: Value from restore-browser-cache
  dawn-path:
    required: true
    description: Value from restore-browser-cache
  dawn-hit:
    required: false
    default: 'false'
    description: Value from restore-browser-cache
  em-key:
    required: true
    description: Value from restore-browser-cache
  em-path:
    required: true
    description: Value from restore-browser-cache
  em-hit:
    required: false
    default: 'false'
    description: Value from restore-browser-cache
  cc-key:
    required: true
    description: Value from restore-browser-cache
  cc-path:
    required: true
    description: Value from restore-browser-cache
  cc-hit:
    required: false
    default: 'false'
    description: Value from restore-browser-cache
runs:
  using: composite
  steps:
    - uses: actions/cache/save@v4
      if: >-
        github.event_name == 'push' &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
        github.actor != 'dependabot[bot]' && inputs.dawn-hit != 'true'
      with:
        path: ${{ inputs.dawn-path }}
        key: ${{ inputs.dawn-key }}
    - uses: actions/cache/save@v4
      if: >-
        github.event_name == 'push' &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
        github.actor != 'dependabot[bot]' && inputs.em-hit != 'true'
      with:
        path: ${{ inputs.em-path }}
        key: ${{ inputs.em-key }}
    - uses: actions/cache/save@v4
      if: >-
        github.event_name == 'push' &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
        github.actor != 'dependabot[bot]' && inputs.cc-hit != 'true'
      with:
        path: ${{ inputs.cc-path }}
        key: ${{ inputs.cc-key }}
