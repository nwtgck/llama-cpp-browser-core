name: Build and publish runtime

on:
  push:
    branches-ignore:
      - artifacts
      - 'artifacts/**'
  # A human-created PR is the handoff after the updater's GITHUB_TOKEN push.
  # Push + synchronize duplicates are intentional; there is no deduplication gate.
  pull_request:
    types: [opened, reopened, synchronize]
    branches-ignore:
      - artifacts
      - 'artifacts/**'
  workflow_dispatch:

# PR events normally check out a synthetic merge commit. All jobs deliberately
# build the immutable PR head instead, so push and PR artifacts share a source
# identity and comments can match the manifest to the actual PR head.
env:
  LCB_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

defaults:
  run:
    working-directory: llama-cpp

permissions:
  contents: read

jobs:
  test:
    name: Test host and publication code
    if: >-
      (github.event_name == 'pull_request' && github.head_ref != 'artifacts' && !startsWith(github.head_ref, 'artifacts/')) ||
      (github.event_name != 'pull_request' && github.ref_type == 'branch' && github.ref_name != 'artifacts' && !startsWith(github.ref_name, 'artifacts/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.LCB_SOURCE_COMMIT }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify the checked-out source identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$LCB_SOURCE_COMMIT"
      - name: Test host and publication code
        run: |
          npm test
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 -m unittest discover -s ../tests -p 'test_*.py'
      - name: Test bounded BF16 weight expansion with native GGML
        run: |
          cmake -S tests/mtmd-bf16 -B build/mtmd-bf16-tests -DLCB_LLAMA_SOURCE="$PWD/vendor/llama.cpp"
          cmake --build build/mtmd-bf16-tests --target mtmd-bf16-test --parallel 2
          build/mtmd-bf16-tests/mtmd-bf16-test
  compile:
    name: Build ${{ matrix.profile }} / ${{ matrix.variant }}
    if: >-
      (github.event_name == 'pull_request' && github.head_ref != 'artifacts' && !startsWith(github.head_ref, 'artifacts/')) ||
      (github.event_name != 'pull_request' && github.ref_type == 'branch' && github.ref_name != 'artifacts' && !startsWith(github.ref_name, 'artifacts/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Intentionally omit max-parallel: use all available runners to reduce build wait time.
      # Do not add a workflow-level parallelism cap; runner/account limits still apply.
      matrix:
        profile:
          - cpu-wasm32
          - cpu-wasm64
          - webgpu-wasm32-asyncify
          - webgpu-wasm32-jspi
          - webgpu-wasm64-jspi
        variant:
          - browser
          - test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.LCB_SOURCE_COMMIT }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang cmake
      - name: Install pinned toolchain
        run: python3 scripts/setup_toolchain.py
      - name: Build profile
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
          VARIANT: ${{ matrix.variant }}
        run: |
          source .tools/emsdk/emsdk_env.sh
          python3 scripts/build.py --profile "$PROFILE" --variant "$VARIANT"
      - name: Stage package inputs
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
          VARIANT: ${{ matrix.variant }}
        run: |
          extra=()
          if [[ "$PROFILE" == "webgpu-wasm64-jspi" && "$VARIANT" == "browser" ]]; then
            extra+=(--include-toolchain-notices)
          fi
          python3 scripts/stage_ci_build.py --profile "$PROFILE" --variant "$VARIANT" "${extra[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: profile-build-${{ matrix.profile }}-${{ matrix.variant }}
          path: llama-cpp/build/ci-upload/
          if-no-files-found: error
          # The staging script copies runtime/API/provenance and license files only.
          include-hidden-files: true
          compression-level: 1
          retention-days: 14
      - name: Report source changes after a failure
        if: failure()
        run: |
          git status --short --untracked-files=all --ignore-submodules=none
          git diff --stat
          git diff --cached --stat
          git submodule foreach --recursive 'git status --short --untracked-files=all --ignore-submodules=none'
  build:
    needs: [test, compile]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.LCB_SOURCE_COMMIT }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/download-artifact@v4
        with:
          pattern: profile-build-*
          path: llama-cpp/build/
          # Every shard owns one profile/variant pair; only wasm64 WebGPU JSPI/browser supplies notices.
          merge-multiple: true
      - name: Assemble runtime-only package
        run: |
          python3 scripts/package_runtime.py \
            --license-root vendor/llama.cpp \
            --license-root build/toolchain-licenses/emscripten \
            --license-root build/toolchain-licenses/emdawnwebgpu_pkg
      - name: Test the Node-enabled Asyncify variant with real Wasm
        run: node tests/asyncify-rewind.mjs
      - name: Test both variants with real CPU Wasm and GPU suspension in Chromium
        run: |
          npm install --prefix .tools/browser --no-save --package-lock=false playwright@1.58.2
          .tools/browser/node_modules/.bin/playwright install --with-deps chromium
          python3 scripts/make_test_model.py build/fixture.gguf
          node tests/browser-smoke.mjs dist/package build/fixture.gguf
      - name: Record verified scope and repackage
        run: |
          python3 scripts/record_browser_validation.py
          python3 scripts/package_runtime.py \
            --license-root vendor/llama.cpp \
            --license-root build/toolchain-licenses/emscripten \
            --license-root build/toolchain-licenses/emdawnwebgpu_pkg
          python3 scripts/package_runtime.py --verify-only
      - uses: actions/upload-artifact@v4
        with:
          name: llama-runtime-package
          path: llama-cpp/dist/package/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Report source changes after a failure
        if: failure()
        run: |
          git status --short --untracked-files=all --ignore-submodules=none
          git diff --stat
          git diff --cached --stat
          git submodule foreach --recursive 'git status --short --untracked-files=all --ignore-submodules=none'
  image-native:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: stable-diffusion-cpp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.LCB_SOURCE_COMMIT }}
          submodules: recursive
          persist-credentials: false
      - name: Test exact patch preparation and host code
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Native bridge and actual patched normalization tests
        run: |
          python3 scripts/prepare_upstream.py --output build/native-src
          cmake -S . -B build/native -G Ninja \
            -DSDCB_NATIVE_CHECK=ON -DCMAKE_BUILD_TYPE=Release \
            '-DCMAKE_CXX_FLAGS_RELEASE=-O1 -DNDEBUG' \
            -DSDCB_SOURCE="$PWD/build/native-src/stable-diffusion" \
            -DSDCB_GGML_SOURCE="$PWD/build/native-src/ggml/ggml"
          cmake --build build/native --parallel 2
          ctest --test-dir build/native --output-on-failure
  image-compile:
    needs: test
    name: Image ${{ matrix.profile }} / ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: stable-diffusion-cpp
    strategy:
      fail-fast: false
      matrix:
        profile:
          - webgpu-wasm32-asyncify
          - webgpu-wasm32-jspi
        variant:
          - browser
          - test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.LCB_SOURCE_COMMIT }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang cmake
      - name: Install the same pinned browser toolchain
        run: python3 ../llama-cpp/scripts/setup_toolchain.py
      - name: Build image profile
        env:
          PROFILE: ${{ matrix.profile }}
          VARIANT: ${{ matrix.variant }}
        shell: bash
        run: |
          source ../llama-cpp/.tools/emsdk/emsdk_env.sh
          python3 scripts/build.py --profile "$PROFILE" --variant "$VARIANT"
      - uses: actions/upload-artifact@v4
        with:
          name: image-build-${{ matrix.profile }}-${{ matrix.variant }}
          path: stable-diffusion-cpp/build/ci-upload/
          if-no-files-found: error
          compression-level: 1
          retention-days: 14
  image-build:
    needs: [image-native, image-compile, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: stable-diffusion-cpp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.LCB_SOURCE_COMMIT }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/download-artifact@v4
        with:
          pattern: image-build-*
          path: stable-diffusion-cpp/build/
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: profile-build-webgpu-wasm64-jspi-browser
          path: llama-cpp/build/
      - name: Package image runtime
        run: |
          python3 scripts/package_runtime.py \
            --license-root ../llama-cpp/build/toolchain-licenses/emscripten \
            --license-root ../llama-cpp/build/toolchain-licenses/emdawnwebgpu_pkg
      - name: Real Wasm ABI smoke (not image inference)
        run: |
          npm install --prefix ../llama-cpp/.tools/browser --no-save --package-lock=false playwright@1.58.2
          ../llama-cpp/.tools/browser/node_modules/.bin/playwright install --with-deps chromium
          node tests/browser-smoke.mjs dist/package
          python3 scripts/package_runtime.py \
            --license-root ../llama-cpp/build/toolchain-licenses/emscripten \
            --license-root ../llama-cpp/build/toolchain-licenses/emdawnwebgpu_pkg
      - uses: actions/upload-artifact@v4
        with:
          name: image-runtime-package
          path: stable-diffusion-cpp/dist/package/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
  publish:
    needs: [build, image-build]
    defaults:
      run:
        working-directory: .
    # Ordinary same-repository PR heads have the same publication trust as
    # source pushes. Fork PRs and Dependabot runs never receive write credentials.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.LCB_SOURCE_COMMIT }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/download-artifact@v4
        with:
          name: llama-runtime-package
          path: build/package-inputs/llama-cpp/
      - uses: actions/download-artifact@v4
        with:
          name: image-runtime-package
          path: build/package-inputs/stable-diffusion-cpp/
      - name: Assemble both source-bound runtimes
        run: python3 scripts/package_runtime.py
      - name: Verify package source before publication
        run: |
          python3 - <<'PYVERIFY'
          import json, os
          from pathlib import Path
          source = json.loads(Path('dist/package/manifest.json').read_text())['sourceCommit']
          if source != os.environ['LCB_SOURCE_COMMIT']:
              raise SystemExit('Runtime package does not match the selected source commit; publication is blocked.')
          PYVERIFY
      - name: Publish append-only artifact commit
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_artifacts.py --package dist/package --remote "https://github.com/${GITHUB_REPOSITORY}.git"
      - name: Generate npm lock and consumer integration metadata
        env:
          ARTIFACT_COMMIT: ${{ steps.publish.outputs.commit }}
        run: python3 scripts/consumer_metadata.py --package dist/package --commit "$ARTIFACT_COMMIT"
      - uses: actions/upload-artifact@v4
        with:
          name: consumer-update-${{ github.run_attempt }}
          path: build/consumer-update/
          if-no-files-found: error
          retention-days: 90
      - name: Preserve publication status after a reporting failure
        if: failure() && steps.publish.outputs.commit != ''
        env:
          ARTIFACT_COMMIT: ${{ steps.publish.outputs.commit }}
        run: |
          echo "Runtime artifact $ARTIFACT_COMMIT is already published; consumer reporting failed." >> "$GITHUB_STEP_SUMMARY"
